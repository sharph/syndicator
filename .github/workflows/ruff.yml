name: Ruff Lint

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run Ruff Linter
        uses: astral-sh/ruff-action@v4.1.0
        with:
          src: syndicatorapi
          args: check
      - name: Run Ruff Formatter
        uses: astral-sh/ruff-action@v4.1.0
        with:
          src: syndicatorapi
          args: format --check
