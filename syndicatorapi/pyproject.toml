[project]
name = "syndicatorapi"
version = "0.1.0"
description = "Syndicator API - Django backend for RSS feed reader"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4==4.15.0",
    "django==6.1.2",
    "django-autoslug==1.9.9",
    "django-cors-headers==4.9.0",
    "django-ninja==1.7.1",
    "email-normalize==3.2.0",
    "gunicorn==26.2.0",
    "lxml==6.1.3",
    "psycopg2-binary==2.9.13",
    "requests==2.34.2",
    "whitenoise==6.12.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
]

[tool.uv]
# This is a Django application, not an installable package
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # Pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "W",    # pycodestyle warnings
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C90",  # mccabe complexity
    "RUF",  # Ruff-specific rules
    "S",    # flake8-bandit (security)
    "DJ",   # flake8-django
    "PT",   # flake8-pytest-style
]

[tool.ruff.lint.per-file-ignores]
# Migrations are auto-generated, don't lint strictly
"**/migrations/**" = ["E501", "RUF012", "I"]
# Tests can use assert, hardcoded values, and random
"**/tests.py" = ["S101", "S106", "S311", "PT009", "F403", "F841"]
"**/test_*.py" = ["S101", "S106", "S311", "PT009", "RUF059"]
# Django admin patterns
"**/admin.py" = ["E731", "RUF012"]
# Django models: null=True on string fields is intentional for optional data,
# RUF012 mutable class attributes are standard Django patterns (Meta.ordering, REQUIRED_FIELDS)
"**/models.py" = ["DJ001", "RUF012", "S311"]
